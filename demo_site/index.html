<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mayank Puvvala — Talk to My AI Assistant</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #12141a;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 420px;
    text-align: center;
    padding: 40px 32px;
    background: #1b1e27;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }
  p {
    color: #a1a1aa;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  button {
    font-size: 16px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: #6366f1;
    color: white;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: #4f46e5; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status {
    margin-top: 18px;
    font-size: 13px;
    color: #71717a;
    min-height: 18px;
  }
  #status.live { color: #22c55e; }
  #status.error { color: #ef4444; }
</style>
</head>
<body>
  <div class="card">
    <h1>Talk to Mayank's AI assistant</h1>
    <p>Click below, allow microphone access, and ask about his experience, projects, or skills — or leave your contact info for a callback.</p>
    <button id="callBtn">Start Call</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import Vapi from "https://esm.sh/@vapi-ai/web@latest";

    // EDIT ME: your Vapi PUBLIC key (dashboard -> API Keys -> Public Key). Never put the PRIVATE key here.
    const VAPI_PUBLIC_KEY = "0f495911-a3b0-4d73-9159-09124c3aed07";
    // EDIT ME: the "Mayank Puvvala - AI Assistant" assistant's ID (Vapi dashboard, assistant settings).
    const VAPI_ASSISTANT_ID = "cc145784-304c-4f54-ab4b-80edd95ba824";

    const vapi = new Vapi(VAPI_PUBLIC_KEY);
    const btn = document.getElementById("callBtn");
    const status = document.getElementById("status");
    let inCall = false;

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = cls || "";
    }

    btn.addEventListener("click", () => {
      if (inCall) {
        vapi.stop();
        return;
      }
      btn.disabled = true;
      setStatus("Connecting…");
      vapi.start(VAPI_ASSISTANT_ID);
    });

    vapi.on("call-start", () => {
      inCall = true;
      btn.disabled = false;
      btn.textContent = "End Call";
      setStatus("Live — go ahead and talk", "live");
    });

    vapi.on("call-end", () => {
      inCall = false;
      btn.disabled = false;
      btn.textContent = "Start Call";
      setStatus("Call ended. Click to talk again.");
    });

    vapi.on("error", (e) => {
      inCall = false;
      btn.disabled = false;
      btn.textContent = "Start Call";
      setStatus("Something went wrong — refresh and try again.", "error");
      console.error(e);
    });
  </script>
</body>
</html>
