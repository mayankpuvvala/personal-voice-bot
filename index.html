<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mayank Puvvala — Talk to My AI Assistant</title>
<style>
  :root {
    --bg: #f7f7f4;
    --bg-soft: #ffffff;
    --ink: #10182b;
    --muted: #64748b;
    --border: #e4e4df;
    --accent: #0e7490;
    --accent-soft: rgba(14, 116, 144, 0.1);
    --live: #16a34a;
    --error: #dc2626;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* ---------- call screen: fixed viewport, never scrolls ---------- */
  .call-screen {
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    position: relative;
    overflow: hidden;
    text-align: center;
    background:
      radial-gradient(circle at 50% -10%, rgba(14, 116, 144, 0.08), transparent 55%),
      linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid rgba(14, 116, 144, 0.18);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 22px;
  }

  .avatar-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  .pulse-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    opacity: 0;
  }

  .pulse-ring.active {
    animation: pulse 2.2s ease-out infinite;
  }

  .pulse-ring.delay.active {
    animation-delay: 1.1s;
  }

  @keyframes pulse {
    0% { transform: scale(0.85); opacity: 0.55; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .avatar {
    position: relative;
    z-index: 1;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), #155e75);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    box-shadow: 0 10px 30px -8px rgba(14, 116, 144, 0.5);
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    max-width: 420px;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.55;
    margin: 0 0 28px;
  }

  /* ---------- visualizer + duration (only visible mid-call) ---------- */
  .call-meta {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .call-meta.visible {
    display: flex;
  }

  .visualizer {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 32px;
  }

  .visualizer .bar {
    width: 3px;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), #155e75);
    transition: height 0.09s ease;
  }

  .duration {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.02em;
  }

  .duration::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live);
    animation: blink 1.4s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 30px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 22px -8px rgba(14, 116, 144, 0.55);
  }

  button:hover { background: #0b5c74; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  .icon-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 50%;
    background: var(--bg-soft);
    color: var(--ink);
    border: 1px solid var(--border);
    box-shadow: none;
    font-size: 18px;
  }

  .icon-btn.visible { display: flex; }
  .icon-btn:hover { background: #f1f1ee; }
  .icon-btn.muted { color: var(--error); border-color: rgba(220, 38, 38, 0.3); }

  #status {
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }

  #status.live { color: var(--live); font-weight: 600; }
  #status.error { color: var(--error); }

  /* ---------- portfolio option: fixed bottom-right ---------- */
  .portfolio-fab {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 20;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 20px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 26px -10px rgba(16, 24, 43, 0.5);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }

  .portfolio-fab:hover { background: #262f45; transform: translateY(-2px); }
  .portfolio-fab:active { transform: translateY(0); }

  .portfolio-fab .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--live);
    flex-shrink: 0;
  }

  @media (max-width: 480px) {
    .portfolio-fab {
      right: 14px;
      bottom: 14px;
      padding: 9px 16px;
      font-size: 12.5px;
    }
  }
</style>
</head>
<body>

  <section class="call-screen" id="callScreen">
    <p class="eyebrow">Mayank's AI assistant</p>

    <div class="avatar-wrap">
      <div class="pulse-ring" id="ring1"></div>
      <div class="pulse-ring delay" id="ring2"></div>
      <div class="avatar">MP</div>
    </div>

    <h1>Talk to Mayank's AI assistant</h1>
    <p class="subtitle">Click below, allow microphone access, and ask about his experience, projects, or skills — or leave your contact info for a callback.</p>

    <div class="call-meta" id="callMeta">
      <div class="visualizer" id="visualizer"></div>
      <div class="duration" id="duration">00:00</div>
    </div>

    <div class="controls">
      <button id="callBtn">Start Call</button>
      <button id="muteBtn" class="icon-btn" aria-label="Mute microphone">🎙</button>
    </div>

    <div id="status"></div>
  </section>

  <a class="portfolio-fab" href="https://portfolio-site-iota-eight-83.vercel.app" target="_blank" rel="noreferrer">
    <span class="dot"></span>
    <span>View my portfolio ↗</span>
  </a>

  <script type="module">
    import Vapi from "https://esm.sh/@vapi-ai/web@latest";

    // EDIT ME: your Vapi PUBLIC key (dashboard -> API Keys -> Public Key). Never put the PRIVATE key here.
    const VAPI_PUBLIC_KEY = "0f495911-a3b0-4d73-9159-09124c3aed07";
    // EDIT ME: the "Mayank Puvvala - AI Assistant" assistant's ID (Vapi dashboard, assistant settings).
    const VAPI_ASSISTANT_ID = "cc145784-304c-4f54-ab4b-80edd95ba824";

    const vapi = new Vapi(VAPI_PUBLIC_KEY);
    const btn = document.getElementById("callBtn");
    const muteBtn = document.getElementById("muteBtn");
    const status = document.getElementById("status");
    const callMeta = document.getElementById("callMeta");
    const durationEl = document.getElementById("duration");
    const visualizer = document.getElementById("visualizer");
    const ring1 = document.getElementById("ring1");
    const ring2 = document.getElementById("ring2");

    let inCall = false;
    let muted = false;
    let callStartedAt = null;
    let durationTimer = null;
    let assistantVolume = 0;
    let micStream = null;
    let audioCtx = null;
    let analyser = null;
    let micData = null;
    let micRafId = null;

    // build the equalizer bars once
    const BAR_COUNT = 20;
    const bars = [];
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement("div");
      bar.className = "bar";
      visualizer.appendChild(bar);
      bars.push(bar);
    }

    function setStatus(text, cls) {
      status.textContent = text;
      status.className = cls || "";
    }

    function formatDuration(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const mm = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const ss = String(totalSeconds % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function startDurationTimer() {
      callStartedAt = Date.now();
      durationEl.textContent = "00:00";
      durationTimer = setInterval(() => {
        durationEl.textContent = formatDuration(Date.now() - callStartedAt);
      }, 1000);
    }

    function stopDurationTimer() {
      if (durationTimer) clearInterval(durationTimer);
      durationTimer = null;
      callStartedAt = null;
      durationEl.textContent = "00:00";
    }

    function resetBars() {
      bars.forEach((bar) => (bar.style.height = "4px"));
    }

    // drives the equalizer from a 0..1 amplitude, whichever side (assistant or caller) is louder
    function updateBars(volume) {
      const base = Math.min(1, Math.max(0, volume));
      bars.forEach((bar, i) => {
        // stagger bars around the center so it reads as a waveform, not a single block
        const mid = BAR_COUNT / 2;
        const falloff = 1 - Math.abs(i - mid) / mid * 0.6;
        const jitter = 0.75 + Math.random() * 0.5;
        const height = Math.max(4, base * 28 * falloff * jitter);
        bar.style.height = `${height}px`;
      });
    }

    // the assistant's audio level comes from Vapi's "volume-level" event, but that event
    // ONLY reflects the assistant's own voice — not the caller's mic. To make the bars react
    // when the user is speaking too, we tap the mic directly via the Web Audio API and take
    // whichever level (assistant or caller) is louder on each frame.
    async function startMicAnalyser() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.6;
        source.connect(analyser);
        micData = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        console.error("Mic visualizer unavailable:", e);
      }
    }

    function stopMicAnalyser() {
      if (micStream) micStream.getTracks().forEach((t) => t.stop());
      micStream = null;
      if (audioCtx) audioCtx.close();
      audioCtx = null;
      analyser = null;
      micData = null;
    }

    function renderLoop() {
      let micLevel = 0;
      if (analyser && micData && !muted) {
        analyser.getByteTimeDomainData(micData);
        let sumSquares = 0;
        for (let i = 0; i < micData.length; i++) {
          const v = (micData[i] - 128) / 128;
          sumSquares += v * v;
        }
        micLevel = Math.sqrt(sumSquares / micData.length) * 3.5;
      }
      updateBars(Math.max(assistantVolume, micLevel));
      micRafId = requestAnimationFrame(renderLoop);
    }

    btn.addEventListener("click", () => {
      if (inCall) {
        vapi.stop();
        return;
      }
      btn.disabled = true;
      setStatus("Connecting…");
      vapi.start(VAPI_ASSISTANT_ID);
    });

    muteBtn.addEventListener("click", () => {
      muted = !muted;
      vapi.setMuted(muted);
      muteBtn.textContent = muted ? "🔇" : "🎙";
      muteBtn.classList.toggle("muted", muted);
      muteBtn.setAttribute("aria-label", muted ? "Unmute microphone" : "Mute microphone");
    });

    vapi.on("call-start", () => {
      inCall = true;
      muted = false;
      assistantVolume = 0;
      btn.disabled = false;
      btn.textContent = "End Call";
      setStatus("Live — go ahead and talk", "live");
      callMeta.classList.add("visible");
      muteBtn.classList.add("visible");
      muteBtn.textContent = "🎙";
      muteBtn.classList.remove("muted");
      ring1.classList.add("active");
      ring2.classList.add("active");
      startDurationTimer();
      startMicAnalyser();
      renderLoop();
    });

    vapi.on("call-end", () => {
      inCall = false;
      btn.disabled = false;
      btn.textContent = "Start Call";
      setStatus("Call ended. Click to talk again.");
      callMeta.classList.remove("visible");
      muteBtn.classList.remove("visible");
      ring1.classList.remove("active");
      ring2.classList.remove("active");
      stopDurationTimer();
      if (micRafId) cancelAnimationFrame(micRafId);
      micRafId = null;
      stopMicAnalyser();
      resetBars();
    });

    vapi.on("volume-level", (volume) => {
      assistantVolume = volume;
    });

    vapi.on("error", (e) => {
      inCall = false;
      btn.disabled = false;
      btn.textContent = "Start Call";
      setStatus("Something went wrong — refresh and try again.", "error");
      callMeta.classList.remove("visible");
      muteBtn.classList.remove("visible");
      ring1.classList.remove("active");
      ring2.classList.remove("active");
      stopDurationTimer();
      if (micRafId) cancelAnimationFrame(micRafId);
      micRafId = null;
      stopMicAnalyser();
      resetBars();
      console.error(e);
    });
  </script>
</body>
</html>
